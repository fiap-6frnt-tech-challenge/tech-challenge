# Bytebank — orquestração local completa (Sprint 4, Task 06).
# Sobe db + shell + dashboard-mfe + transactions-mfe numa rede interna.
#
# Primeiro boot (clone limpo) — migrate + seed rodam FORA do compose:
#
#   cp .env.example .env                 # ajuste AUTH_SECRET e as senhas do Postgres
#   docker compose up -d db              # sobe só o Postgres
#   npm run db:migrate -w @bytebank/shell
#   npm run db:seed -w @bytebank/shell
#   docker compose up --build            # sobe shell + MFEs
#
# Migrações e seed usam o dono do schema (bytebank:<POSTGRES_PASSWORD>@localhost:5432);
# o shell usa o bytebank_app, criado por docker/postgres/init só com volume vazio.
services:
  db:
    image: postgres:16-alpine
    container_name: bytebank-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bytebank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja .env.example)}
      POSTGRES_DB: bytebank
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?defina POSTGRES_APP_PASSWORD no .env (veja .env.example)}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - bytebank-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bytebank -d bytebank']
      interval: 5s
      timeout: 5s
      retries: 5

  shell:
    build:
      context: .
      dockerfile: apps/shell/Dockerfile
    container_name: bytebank-shell
    depends_on:
      db:
        condition: service_healthy
    environment:
      # O shell fala com o Postgres pelo nome de serviço na rede do compose.
      DATABASE_URL: postgres://bytebank_app:${POSTGRES_APP_PASSWORD}@db:5432/bytebank
      # NextAuth v5 (o código lê AUTH_*, não NEXTAUTH_*). AUTH_TRUST_HOST já vem do Dockerfile.
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret}
      AUTH_URL: http://localhost:3000
      CSP_MODE: ${CSP_MODE:-report-only}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      HIBP_ENABLED: ${HIBP_ENABLED:-true}
      AUTH_MAX_FAILURES: ${AUTH_MAX_FAILURES:-5}
      AUTH_WINDOW_SECONDS: ${AUTH_WINDOW_SECONDS:-900}
      AUTH_LOCK_SECONDS: ${AUTH_LOCK_SECONDS:-900}
      AUTH_MAX_LOCK_SECONDS: ${AUTH_MAX_LOCK_SECONDS:-86400}
      AUTH_IP_MAX_FAILURES: ${AUTH_IP_MAX_FAILURES:-20}
      AUTH_IP_WINDOW_SECONDS: ${AUTH_IP_WINDOW_SECONDS:-900}
      AUTH_IP_LOCK_SECONDS: ${AUTH_IP_LOCK_SECONDS:-900}
      AUTH_REGISTER_IP_MAX_FAILURES: ${AUTH_REGISTER_IP_MAX_FAILURES:-10}
      AUTH_REGISTER_IP_WINDOW_SECONDS: ${AUTH_REGISTER_IP_WINDOW_SECONDS:-3600}
      AUTH_REGISTER_IP_LOCK_SECONDS: ${AUTH_REGISTER_IP_LOCK_SECONDS:-3600}
      # Os NEXT_PUBLIC_* apontam para localhost porque quem busca os remotes é o
      # NAVEGADOR (não o container do shell) — as portas são publicadas no host.
      NEXT_PUBLIC_DASHBOARD_MFE_URL: http://localhost:3002/mf-manifest.json
      NEXT_PUBLIC_TRANSACTIONS_MFE_URL: http://localhost:3003/mf-manifest.json
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:-1:Ynl0ZWJhbmstZG9ja2VyLWxvY2FsLXNtb2tlLWtleSE=}
      DATA_ENCRYPTION_ACTIVE_KEY_ID: ${DATA_ENCRYPTION_ACTIVE_KEY_ID:-1}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:-Ynl0ZWJhbmstZG9ja2VyLWJsaW5kLWluZGV4LWtleSE=}
    volumes:
      - bytebank-uploads:/app/.uploads
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/shell/.next/cache:uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - '3000:3000'

  dashboard-mfe:
    build:
      context: .
      dockerfile: apps/dashboard-mfe/Dockerfile
      args:
        # build arg → assetPrefix dos chunks federados; se mudar a porta publicada, rebuild.
        MFE_ORIGIN: http://localhost:3002
    container_name: bytebank-dashboard-mfe
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - '3002:8080'

  transactions-mfe:
    build:
      context: .
      dockerfile: apps/transactions-mfe/Dockerfile
      args:
        MFE_ORIGIN: http://localhost:3003
    container_name: bytebank-transactions-mfe
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - '3003:8080'

volumes:
  bytebank-pgdata:
  bytebank-uploads:
