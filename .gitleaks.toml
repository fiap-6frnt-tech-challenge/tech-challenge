title = "Bytebank Gitleaks configuration"

[extend]
useDefault = true

# Exact non-production database fixtures used only by the local Docker Compose setup.
[[allowlists]]
description = "Local Docker Compose database fixture"
condition = "AND"
paths = ['''^docker-compose\.yml$''']
regexTarget = "match"
regexes = [
  '''postgres://bytebank:bytebank@(?:db|localhost):5432/bytebank''',
  '''POSTGRES_PASSWORD:\s*bytebank''',
]

# Test-only secret used by the GitHub Actions E2E job.
[[allowlists]]
description = "Non-production AUTH_SECRET in the E2E workflow"
condition = "AND"
paths = ['''^\.github/workflows/ci\.yml$''']
regexTarget = "match"
regexes = [
  '''AUTH_SECRET:\s*bytebank-e2e-auth-secret-bytebank-e2e-auth-secret''',
]

# Test fixtures: suppress only the generic-api-key false positives reported in
# these exact historical test files. Dedicated credential rules remain enabled.
[[allowlists]]
description = "Mock registration password in route test"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["3348fa8e02020ca874844be3eb40262dd5a0c69d"]
paths = ['''^apps/shell/src/app/api/auth/register/route\.test\.ts$''']

[[allowlists]]
description = "Mock password in core user use-case test"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["3348fa8e02020ca874844be3eb40262dd5a0c69d"]
paths = ['''^packages/core/src/application/use-cases/users\.test\.ts$''']

[[allowlists]]
description = "Mock password in container integration test"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["3348fa8e02020ca874844be3eb40262dd5a0c69d"]
paths = ['''^apps/shell/src/server/container\.integration\.test\.ts$''']

[[allowlists]]
description = "Mock password values in registration schema tests"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["3348fa8e02020ca874844be3eb40262dd5a0c69d"]
paths = ['''^packages/core/src/schemas/register\.test\.ts$''']

# The Chromatic project token has been rotated. These exceptions suppress only
# its generic-api-key findings in the historical commits and files where it appeared.
[[allowlists]]
description = "Revoked Chromatic token in shell package history"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["886261767ed3720176f73f82294a5846b47dc470"]
paths = ['''^apps/shell/package\.json$''']
regexTarget = "secret"
regexes = ['''^chpt_[a-f0-9]+$''']

[[allowlists]]
description = "Revoked Chromatic token in design system migration documentation"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["c17c5c07f36cd125a6892ad1b1f1fa0da17358b1"]
paths = ['''^docs/phase-2/sprint-0/03-extract-design-system\.md$''']
regexTarget = "secret"
