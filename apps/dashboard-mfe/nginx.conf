server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_types application/javascript text/javascript text/css application/json;

  # Short-circuit CORS preflights — sem isso OPTIONS cai no try_files e retorna 404,
  # o que faz o browser rejeitar o preflight mesmo com os headers corretos.
  if ($request_method = 'OPTIONS') {
    return 204;
  }

  # CORS para o shell consumir remoteEntry/mf-manifest cross-origin.
  # Origin restrita ao shell local (compose). Em prod, vercel.json aplica a origin de prod.
  # Vary: Origin omitido — valor fixo, não varia por origin.
  add_header Access-Control-Allow-Origin  "http://localhost:3000" always;
  add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
  add_header Access-Control-Allow-Headers "*" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' http://localhost:3002 http://localhost:3003; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:3000 http://localhost:3002 http://localhost:3003" always;

  # O manifest sempre revalida; os chunks com hash em /static/ são imutáveis.
  # add_header NÃO herda do server quando o location tem seus próprios add_header,
  # então repetimos CORS e nosniff aqui — senão o shell não consegue ler o manifest cross-origin.
  location ~ ^/(mf-manifest\.json|remoteEntry\.js)$ {
    add_header Access-Control-Allow-Origin  "http://localhost:3000" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' http://localhost:3002 http://localhost:3003; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:3000 http://localhost:3002 http://localhost:3003" always;
    add_header Cache-Control "no-cache" always;
  }

  # Sem always: um 404 não pode ficar em cache por um ano.
  location /static/ {
    add_header Access-Control-Allow-Origin  "http://localhost:3000" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' http://localhost:3002 http://localhost:3003; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:3000 http://localhost:3002 http://localhost:3003" always;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
