name: Security

on:
  pull_request:
    branches: [phase-4, main]
  push:
    branches: [phase-4, main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan git history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact -v

  sast:
    name: SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Scan source code
        run: semgrep scan --config p/owasp-top-ten --config p/typescript --config p/react --error

  images:
    name: Image scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shell
            dockerfile: apps/shell/Dockerfile
            image: bytebank-shell
          - name: dashboard-mfe
            dockerfile: apps/dashboard-mfe/Dockerfile
            image: bytebank-dashboard-mfe
          - name: transactions-mfe
            dockerfile: apps/transactions-mfe/Dockerfile
            image: bytebank-transactions-mfe
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build ${{ matrix.name }} image
        run: docker build --pull -f "${{ matrix.dockerfile }}" -t "${{ matrix.image }}" .

      - name: Scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  security:
    name: Security
    if: always()
    needs: [dependencies, secrets, sast, images]
    runs-on: ubuntu-latest
    steps:
      - name: Require every security scan to pass
        env:
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
        run: |
          if [ "$DEPENDENCIES_RESULT" != "success" ] || \
             [ "$SECRETS_RESULT" != "success" ] || \
             [ "$SAST_RESULT" != "success" ] || \
             [ "$IMAGES_RESULT" != "success" ]; then
            echo "One or more security scans did not pass."
            exit 1
          fi
