version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: phase-4
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: phase-4
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directories:
      - /apps/shell
      - /apps/dashboard-mfe
      - /apps/transactions-mfe
    target-branch: phase-4
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
